services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: t3relay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: t3relay
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d t3relay"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  postgres-data:
