name: Deploy Launchpad relay

# Deploys the self-hosted relay (infra/hetzner) by running deploy.sh against
# the relay host: rsync this checkout, build the relay and executor images on
# the box, migrate, restart. Replaces the upstream Cloudflare/Alchemy deploy.
#
# CI ships whatever lands on main — the locally-run infra/hetzner/deploy.sh
# remains the path for deploying uncommitted or unpushed work.
#
# The production environment must define:
#   vars.RELAY_DEPLOY_HOST         e.g. root@46.224.12.144
#   vars.RELAY_DEPLOY_KNOWN_HOSTS  the host's ssh-keyscan line, pinned
#   secrets.RELAY_DEPLOY_SSH_KEY   private key authorized on the host
#
# Optional, to configure the relay's GitHub App without touching the host —
# the deploy writes them into /etc/launchpad-relay/relay.env:
#   secrets.RELAY_GITHUB_APP_ID           the App's numeric id
#   secrets.RELAY_GITHUB_APP_SLUG         the App's slug (github.com/apps/<slug>)
#   secrets.RELAY_GITHUB_APP_PRIVATE_KEY  a private key PEM generated on the App's settings page

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-production
  cancel-in-progress: false

jobs:
  deploy_relay:
    name: Deploy self-hosted relay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          RELAY_DEPLOY_SSH_KEY: ${{ secrets.RELAY_DEPLOY_SSH_KEY }}
          RELAY_DEPLOY_KNOWN_HOSTS: ${{ vars.RELAY_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$RELAY_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$RELAY_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          RELAY_DEPLOY_HOST: ${{ vars.RELAY_DEPLOY_HOST }}
          RELAY_GITHUB_APP_ID: ${{ secrets.RELAY_GITHUB_APP_ID }}
          RELAY_GITHUB_APP_SLUG: ${{ secrets.RELAY_GITHUB_APP_SLUG }}
          RELAY_GITHUB_APP_PRIVATE_KEY: ${{ secrets.RELAY_GITHUB_APP_PRIVATE_KEY }}
        run: infra/hetzner/deploy.sh "$RELAY_DEPLOY_HOST"
